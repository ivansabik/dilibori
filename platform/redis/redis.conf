bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60
daemonize no
supervised no
loglevel notice
databases 16
maxmemory 256mb
maxmemory-policy allkeys-lru
# Writable copy under /data so ACL SAVE keeps tenant users across restarts.
aclfile /data/users.acl
requirepass platform-redis-admin
