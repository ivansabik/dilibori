# Shared multi-tenant cell (local PoC).
# Tenants are created by the runtime agent, not declared here.
name: dilibori-platform

services:
  ingress:
    image: caddy:2.8-alpine
    container_name: dilibori-caddy
    ports:
      - "${INGRESS_HTTP_PORT:-8088}:80"
    volumes:
      - ./ingress/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/ingress/tenants:/etc/caddy/tenants:ro
    networks:
      - dilibori-ingress
      - dilibori-shared
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-platform-root-change-me}
      MYSQL_DATABASE: platform_meta
    volumes:
      # Named volume: bind-mounted datadir is painfully slow on Docker Desktop (macOS).
      - mariadb_data:/var/lib/mysql
      - ./proxies/mariadb/init:/docker-entrypoint-initdb.d:ro
    command:
      - --max_connections=200
      - --character-set-server=utf8mb4
    networks:
      dilibori-shared:
        aliases: [mariadb]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  proxysql:
    image: proxysql/proxysql:2.6.3
    volumes:
      - ./proxies/proxysql/proxysql.cnf:/etc/proxysql.cnf:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      dilibori-shared:
        aliases: [proxysql, mysql]
    ports:
      - "${PROXYSQL_ADMIN_PORT:-6032}:6032"
    restart: unless-stopped

  redis:
    image: redis:7
    # Seed /data/users.acl once; runtime ACL SAVE writes tenant users there.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/users.acl ]; then
          cp /seed/users.acl /data/users.acl
        fi
        exec redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl:/seed/users.acl:ro
      - ./data/redis:/data
    networks:
      dilibori-shared:
        aliases: [redis]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_ADMIN_PASSWORD:-platform-redis-admin}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-platformminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-platform-minio-change-me}
    volumes:
      - ./data/minio:/data
    networks:
      dilibori-shared:
        aliases: [minio]
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/dilibori-media || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-platformminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-platform-minio-change-me}
    networks:
      - dilibori-shared
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform-pg-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./control-plane/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./control-plane/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      dilibori-control:
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane -d controlplane"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    environment:
      DATABASE_URL: postgres://controlplane:${POSTGRES_PASSWORD:-platform-pg-change-me}@postgres:5432/controlplane
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 10
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      dilibori-control:
        aliases: [pgbouncer]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.7
    networks:
      dilibori-shared:
        aliases: [mailpit]
    ports:
      # 8025 is often taken by the standalone mailpit/ stack; use 8026 for the cell UI.
      - "${MAILPIT_UI_PORT:-8026}:8025"
    restart: unless-stopped

  control-plane:
    build: ./control-plane
    environment:
      APP_ENV: local
      APP_SECRET_KEY: ${APP_SECRET_KEY:-0123456789abcdef0123456789abcdef}
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_DATABASE: controlplane
      DB_USERNAME: controlplane
      DB_PASSWORD: ${POSTGRES_PASSWORD:-platform-pg-change-me}
      RUNTIME_AGENT_URL: http://runtime-agent:8100
      RUNTIME_AGENT_TOKEN: ${RUNTIME_AGENT_TOKEN:-platform-agent-token-change-me}
      PROFILES_PATH: /opt/platform/profiles
      SEEDS_PATH: /opt/platform/seeds
      SECRETS_PATH: /var/lib/dilibori/secrets
      CELL_ID: local-cell
    volumes:
      - ./profiles:/opt/platform/profiles:ro
      - ./seeds:/opt/platform/seeds:ro
      - ./data/secrets:/var/lib/dilibori/secrets
    depends_on:
      - pgbouncer
      - runtime-agent
    networks:
      - dilibori-control
      - dilibori-ingress
    ports:
      - "${CONTROL_PLANE_PORT:-8099}:8080"
    restart: unless-stopped

  runtime-agent:
    build: ./runtime-agent
    environment:
      RUNTIME_AGENT_TOKEN: ${RUNTIME_AGENT_TOKEN:-platform-agent-token-change-me}
      MARIADB_HOST: mariadb
      MARIADB_ADMIN_USER: root
      MARIADB_ADMIN_PASSWORD: ${MARIADB_ROOT_PASSWORD:-platform-root-change-me}
      REDIS_HOST: redis
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:-platform-redis-admin}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-platformminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-platform-minio-change-me}
      TENANT_IMAGE: ${TENANT_IMAGE:-dilibori/tastyigniter:poc}
      ALLOWED_IMAGES: ${ALLOWED_IMAGES:-dilibori/tastyigniter:poc}
      DATA_DIR: /var/lib/dilibori
      SHARED_NETWORK: dilibori-shared
      PROXYSQL_HOST: proxysql
      MAILPIT_HOST: mailpit
      HOST_SEEDS_PATH: ${HOST_SEEDS_PATH:-}
      HOST_EXTENSIONS_PATH: ${HOST_EXTENSIONS_PATH:-}
      HOST_DATA_PATH: ${HOST_DATA_PATH:-}
      HOST_APP_SEED_PATH: ${HOST_APP_SEED_PATH:-}
      INGRESS_HTTP_PORT: ${INGRESS_HTTP_PORT:-8088}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/var/lib/dilibori
      - ./seeds:/opt/platform/seeds:ro
      - ./profiles:/opt/platform/profiles:ro
      - ../app/extensions:/opt/extensions:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dilibori-control
      - dilibori-shared
    ports:
      - "${RUNTIME_AGENT_PORT:-8100}:8100"
    restart: unless-stopped

networks:
  dilibori-shared:
    name: dilibori-shared
  dilibori-control:
    name: dilibori-control
  dilibori-ingress:
    name: dilibori-ingress

volumes:
  mariadb_data:
  postgres_data:
