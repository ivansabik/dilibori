name: Python CI

on:
  push:
    paths:
      - "cdp/event-sink/**"
      - "ruff.toml"
      - "**/*.py"
      - "infra/**"
      - "app/docker-compose.aws.yml"
      - "app/Caddyfile.aws"
      - "app/aws.env.example"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "cdp/event-sink/**"
      - "ruff.toml"
      - "**/*.py"
      - "infra/**"
      - "app/docker-compose.aws.yml"
      - "app/Caddyfile.aws"
      - "app/aws.env.example"
      - ".github/workflows/platform-ci.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: python3 -m ruff check cdp/event-sink
      - name: Ruff format
        run: python3 -m ruff format --check cdp/event-sink

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate envs/dev
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate envs/prod
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

  box-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck infra/box
        run: shellcheck infra/box/*.sh
      - name: Compose config (aws)
        run: |
          docker compose \
            -f app/docker-compose.aws.yml \
            --env-file app/aws.env.example \
            config -q
