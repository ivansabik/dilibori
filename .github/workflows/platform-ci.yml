name: Python CI

on:
  push:
    paths:
      - "cdp/event-sink/**"
      - "ruff.toml"
      - "**/*.py"
  pull_request:
    paths:
      - "cdp/event-sink/**"
      - "ruff.toml"
      - "**/*.py"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: python3 -m ruff check cdp/event-sink
      - name: Ruff format
        run: python3 -m ruff format --check cdp/event-sink
