name: Platform CI

on:
  push:
    paths:
      - "platform/**"
      - "cdp/event-sink/**"
      - "infra/**"
      - "ruff.toml"
      - "**/*.py"
      - "app/Dockerfile"
      - "app/docker-entrypoint.sh"
      - "app/bin/**"
      - "app/extensions/**"
      - "app/supervisor/**"
  pull_request:
    paths:
      - "platform/**"
      - "cdp/event-sink/**"
      - "infra/**"
      - "ruff.toml"
      - "**/*.py"
      - "app/Dockerfile"
      - "app/docker-entrypoint.sh"
      - "app/bin/**"
      - "app/extensions/**"
      - "app/supervisor/**"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: python3 -m ruff check platform cdp/event-sink
      - name: Ruff format
        run: python3 -m ruff format --check platform cdp/event-sink

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime-agent deps for unit tests
        run: pip install -r runtime-agent/requirements.txt
      - name: Run contract and policy tests
        run: |
          chmod +x scripts/run-tests.sh
          ./scripts/run-tests.sh
      - name: Capacity model smoke
        run: python3 scripts/capacity_model.py --tenants 16 --idle-memory-mb 180 --proxy-budget 80

  runtime-agent-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/runtime-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and compile
        run: |
          pip install -r requirements.txt
          python -m compileall app

  control-plane-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/control-plane
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint
        run: |
          find src public -name '*.php' -print0 | xargs -0 -n1 php -l

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate envs/dev
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate envs/prod
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

  box-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck infra/box
        run: shellcheck infra/box/*.sh
      - name: Compose config (aws override)
        run: |
          docker compose \
            -f platform/docker-compose.yml \
            -f platform/docker-compose.aws.yml \
            --env-file platform/envs/aws-dev.env \
            config -q
