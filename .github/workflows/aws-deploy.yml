name: AWS deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "platform/**"
      - "app/**"
      - "infra/**"
      - ".github/workflows/aws-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to redeploy"
        required: true
        type: choice
        options: [dev, prod]
      image_tag:
        description: "Existing sha-<short7> tag to redeploy (empty = this commit)"
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'pr' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short: ${{ steps.meta.outputs.short }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
            SHORT="${TAG#sha-}"
          else
            SHORT="$(echo "$SHA" | cut -c1-7)"
            TAG="sha-${SHORT}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        if: github.event.inputs.image_tag == ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx build --push \
            -t "${REGISTRY}/dilibori/tastyigniter:${TAG}" \
            -f app/Dockerfile .
          docker buildx build --push \
            -t "${REGISTRY}/dilibori/control-plane:${TAG}" \
            -f platform/control-plane/Dockerfile platform/control-plane
          docker buildx build --push \
            -t "${REGISTRY}/dilibori/runtime-agent:${TAG}" \
            -f platform/runtime-agent/Dockerfile platform/runtime-agent

      - name: Trivy scan (CRITICAL fails)
        if: github.event.inputs.image_tag == ''
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/dilibori/tastyigniter:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload release tarball
        if: github.event.inputs.image_tag == ''
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          BUCKET: ${{ vars.DEV_ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="" -o "/tmp/${SHA}.tar.gz" "${SHA}"
          aws s3 cp "/tmp/${SHA}.tar.gz" "s3://${BUCKET}/releases/${SHA}.tar.gz"

  deploy-dev:
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Configure AWS (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform plan
        id: plan
        working-directory: infra/terraform/envs/dev
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform plan -input=false -out=tfplan -var="domain=${{ vars.DEV_DOMAIN }}" -var="alert_email=${{ vars.ALERT_EMAIL }}" | tee /tmp/tfplan.txt
          echo "plan<<EOF" >> "$GITHUB_OUTPUT"
          tail -n 80 /tmp/tfplan.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Terraform plan (dev)\n\`\`\`\n${{ steps.plan.outputs.plan }}\n\`\`\``;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Terraform apply
        working-directory: infra/terraform/envs/dev
        run: terraform apply -input=false -auto-approve tfplan

      - name: Deploy via SSM
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          INSTANCE_ID="$(cd infra/terraform/envs/dev && terraform output -raw instance_id)"
          # Bootstrap deploy.sh from the release tarball (first deploy has no scripts yet).
          SCRIPT=$(cat <<EOF
          set -euo pipefail
          set -a; . /etc/dilibori/box.env; set +a
          aws s3 cp "s3://\${ARTIFACTS_BUCKET}/releases/${SHA}.tar.gz" /tmp/dilibori-release.tar.gz
          mkdir -p "/opt/dilibori/releases/${SHA}"
          tar -xzf /tmp/dilibori-release.tar.gz -C "/opt/dilibori/releases/${SHA}"
          ln -sfn "/opt/dilibori/releases/${SHA}" /opt/dilibori/releases/current
          mkdir -p /usr/local/lib/dilibori
          ln -sfn /opt/dilibori/releases/current/infra/box /usr/local/lib/dilibori/box
          /usr/local/lib/dilibori/box/deploy.sh "${SHA}"
          EOF
          )
          B64="$(printf '%s' "$SCRIPT" | base64 | tr -d '\n')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "dilibori deploy ${SHA}" \
            --parameters "commands=[\"echo ${B64} | base64 -d | bash\"]" \
            --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          test "$STATUS" = "Success"

      - name: Smoke via SSM
        run: |
          set -euo pipefail
          INSTANCE_ID="$(cd infra/terraform/envs/dev && terraform output -raw instance_id)"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "dilibori smoke" \
            --parameters 'commands=["/usr/local/lib/dilibori/box/smoke.sh"]' \
            --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          test "$STATUS" = "Success"

      - name: Job summary
        run: |
          DOMAIN="${{ vars.DEV_DOMAIN }}"
          {
            echo "## Dev deploy"
            echo "- Storefront: https://taconazo.${DOMAIN}/"
            echo "- Storefront: https://pizza-rin.${DOMAIN}/"
            echo "- Admin: https://taconazo.${DOMAIN}/admin"
            echo "- Tag: ${{ needs.build.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    needs: [build, deploy-dev]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.deploy-dev.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'))
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin crane

      - name: Pull images and tarball from dev
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Export from dev ECR + S3
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          DEV_ACCOUNT: ${{ vars.DEV_AWS_ACCOUNT_ID }}
          DEV_BUCKET: ${{ vars.DEV_ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          REG="${DEV_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | crane auth login --username AWS --password-stdin "$REG"
          mkdir -p /tmp/dilibori-images
          for repo in dilibori/tastyigniter dilibori/control-plane dilibori/runtime-agent; do
            crane pull "${REG}/${repo}:${TAG}" "/tmp/dilibori-images/${repo//\//-}.tar"
          done
          aws s3 cp "s3://${DEV_BUCKET}/releases/${SHA}.tar.gz" "/tmp/${SHA}.tar.gz"

      - name: Configure AWS (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push images and tarball to prod
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          PROD_ACCOUNT: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          PROD_BUCKET: ${{ vars.PROD_ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          REG="${PROD_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | crane auth login --username AWS --password-stdin "$REG"
          for repo in dilibori/tastyigniter dilibori/control-plane dilibori/runtime-agent; do
            crane push "/tmp/dilibori-images/${repo//\//-}.tar" "${REG}/${repo}:${TAG}"
          done
          aws s3 cp "/tmp/${SHA}.tar.gz" "s3://${PROD_BUCKET}/releases/${SHA}.tar.gz"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform apply (prod)
        working-directory: infra/terraform/envs/prod
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var="domain=${{ vars.PROD_DOMAIN }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}"

      - name: Deploy via SSM
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          INSTANCE_ID="$(cd infra/terraform/envs/prod && terraform output -raw instance_id)"
          SCRIPT=$(cat <<EOF
          set -euo pipefail
          set -a; . /etc/dilibori/box.env; set +a
          aws s3 cp "s3://\${ARTIFACTS_BUCKET}/releases/${SHA}.tar.gz" /tmp/dilibori-release.tar.gz
          mkdir -p "/opt/dilibori/releases/${SHA}"
          tar -xzf /tmp/dilibori-release.tar.gz -C "/opt/dilibori/releases/${SHA}"
          ln -sfn "/opt/dilibori/releases/${SHA}" /opt/dilibori/releases/current
          mkdir -p /usr/local/lib/dilibori
          ln -sfn /opt/dilibori/releases/current/infra/box /usr/local/lib/dilibori/box
          /usr/local/lib/dilibori/box/deploy.sh "${SHA}"
          EOF
          )
          B64="$(printf '%s' "$SCRIPT" | base64 | tr -d '\n')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "dilibori deploy ${SHA}" \
            --parameters "commands=[\"echo ${B64} | base64 -d | bash\"]" \
            --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          test "$STATUS" = "Success"

      - name: Smoke via SSM
        run: |
          set -euo pipefail
          INSTANCE_ID="$(cd infra/terraform/envs/prod && terraform output -raw instance_id)"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "dilibori smoke" \
            --parameters 'commands=["/usr/local/lib/dilibori/box/smoke.sh"]' \
            --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          test "$STATUS" = "Success"
