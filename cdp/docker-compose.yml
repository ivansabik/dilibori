name: dilibori-cdp

services:
  jobsdb:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${JOBS_DB_USER:-rudder}
      POSTGRES_PASSWORD: ${JOBS_DB_PASSWORD:-password}
      POSTGRES_DB: ${JOBS_DB_DB_NAME:-jobsdb}
    volumes:
      - ./data/jobsdb:/var/lib/postgresql/data
    ports:
      - "${JOBS_DB_HOST_PORT:-6432}:5432"
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOBS_DB_USER:-rudder} -d ${JOBS_DB_DB_NAME:-jobsdb}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - dilibori
    restart: unless-stopped

  rudder-transformer:
    image: rudderstack/rudder-transformer:1.146.0
    environment:
      STATSD_SERVER_HOST: metrics-exporter
      STATSD_SERVER_PORT: "9125"
    depends_on:
      - metrics-exporter
    networks:
      - dilibori
    restart: unless-stopped

  metrics-exporter:
    image: prom/statsd-exporter:v0.22.4
    networks:
      - dilibori
    restart: unless-stopped

  event-sink:
    build: ./event-sink
    ports:
      - "${EVENT_SINK_HOST_PORT:-8090}:8090"
    volumes:
      - ./data/events:/data
      - ./workspaceConfig.json:/etc/rudderstack/workspaceConfig.json:ro
    environment:
      EVENT_SINK_PORT: "8090"
      EVENT_SINK_DATA: /data/events.jsonl
      EVENT_SINK_WORKSPACE_CONFIG: /etc/rudderstack/workspaceConfig.json
    networks:
      - dilibori
    restart: unless-stopped

  rudder-server:
    image: rudderlabs/rudder-server:1.82.0
    depends_on:
      jobsdb:
        condition: service_healthy
      rudder-transformer:
        condition: service_started
      event-sink:
        condition: service_started
      metrics-exporter:
        condition: service_started
    entrypoint: sh -c '/wait-for jobsdb:5432 -- /rudder-server'
    ports:
      - "${RUDDER_HOST_PORT:-8080}:8080"
    volumes:
      - ./workspaceConfig.json:/etc/rudderstack/workspaceConfig.json:ro
    environment:
      JOBS_DB_HOST: jobsdb
      JOBS_DB_USER: ${JOBS_DB_USER:-rudder}
      JOBS_DB_PORT: "5432"
      JOBS_DB_DB_NAME: ${JOBS_DB_DB_NAME:-jobsdb}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:-password}
      DEST_TRANSFORM_URL: http://rudder-transformer:9090
      STATSD_SERVER_URL: metrics-exporter:9125
      RSERVER_GATEWAY_WEBHOOK_SOURCE_LIST_FOR_PARSING_PARAMS: Shopify
      RSERVER_BACKEND_CONFIG_CONFIG_FROM_FILE: "true"
      RSERVER_BACKEND_CONFIG_CONFIG_JSONPATH: /etc/rudderstack/workspaceConfig.json
      # Unused when config comes from file; set so the process still boots cleanly.
      CONFIG_BACKEND_URL: https://api.rudderstack.com
      WORKSPACE_TOKEN: ${WORKSPACE_TOKEN:-local-unused}
    networks:
      - dilibori
    restart: unless-stopped

networks:
  dilibori:
    name: dilibori
    external: true
