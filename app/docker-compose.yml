name: tastyigniter-local

services:
  app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    hostname: tasty
    ports:
      - "8001:80"
    volumes:
      - ./media:/var/www/persistent-media:rw
      - ./seed:/opt/seed:ro
      - ./extensions:/opt/extensions:ro
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./bin/provision.sh:/usr/local/bin/provision.sh:ro
      - ./bin/restore-missing-media.php:/usr/local/bin/restore-missing-media.php:ro
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://127.0.0.1:8001
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=tastyigniter
      - DB_USERNAME=tastyigniter
      - DB_PASSWORD=tastyigniter
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=database
      - ADMIN_EMAIL=operations@taconazotaqueria.com
      # ADMIN_PASSWORD: omitted on purpose. provision.sh generates a random
      # value and writes it to storage/dilibori-admin-password (make admin-pass).
      - AUTO_PROVISION=true
      - SEED_MANIFEST=/opt/seed/taconazo/manifest.json
      - SEED_MODE=initial
      # CDP / analytics (driver-agnostic; rudderstack locally)
      - CDP_ENABLED=${CDP_ENABLED:-true}
      - EVENT_CLIENT_DRIVER=${EVENT_CLIENT_DRIVER:-rudderstack}
      - RUDDERSTACK_DATA_PLANE_URL=${RUDDERSTACK_DATA_PLANE_URL:-http://rudder-server:8080}
      - RUDDERSTACK_JS_DATA_PLANE_URL=${RUDDERSTACK_JS_DATA_PLANE_URL:-http://127.0.0.1:8080}
      - RUDDERSTACK_HTTP_WRITE_KEY=${RUDDERSTACK_HTTP_WRITE_KEY:-dilibori_http_write_key_local}
      - RUDDERSTACK_JS_WRITE_KEY=${RUDDERSTACK_JS_WRITE_KEY:-dilibori_js_write_key_local}
      - RUDDERSTACK_JS_CONFIG_URL=${RUDDERSTACK_JS_CONFIG_URL:-http://127.0.0.1:8090}
      # Mailpit (local SMTP catcher on the dilibori network)
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
      - MAIL_ENCRYPTION=
      - MAIL_FROM_ADDRESS=hola@eltaconazo.example
      - MAIL_FROM_NAME=El Taconazo Taqueria
    depends_on:
      - db
    networks:
      - default
      - dilibori
    restart: unless-stopped

  db:
    image: mariadb:10.11
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=tastyigniter
      - MYSQL_USER=tastyigniter
      - MYSQL_PASSWORD=tastyigniter
    ports:
      - "3307:3306"
    restart: unless-stopped

networks:
  dilibori:
    name: dilibori
    external: true
