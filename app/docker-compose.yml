name: tastyigniter-local

services:
  app:
    build: .
    hostname: tasty
    ports:
      - "8001:80"
    volumes:
      - ./media:/var/www/persistent-media:rw
      - ./seed:/opt/seed:ro
      - ./extensions:/opt/extensions:ro
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://127.0.0.1:8001
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=tastyigniter
      - DB_USERNAME=tastyigniter
      - DB_PASSWORD=tastyigniter
      - CACHE_DRIVER=redis
      - REDIS_HOST=redis
      - ADMIN_EMAIL=operations@taconazotaqueria.com
      - ADMIN_PASSWORD=12345678abc!
      # CDP / analytics (driver-agnostic; rudderstack locally)
      - CDP_ENABLED=${CDP_ENABLED:-true}
      - EVENT_CLIENT_DRIVER=${EVENT_CLIENT_DRIVER:-rudderstack}
      - RUDDERSTACK_DATA_PLANE_URL=${RUDDERSTACK_DATA_PLANE_URL:-http://rudder-server:8080}
      - RUDDERSTACK_JS_DATA_PLANE_URL=${RUDDERSTACK_JS_DATA_PLANE_URL:-http://127.0.0.1:8080}
      - RUDDERSTACK_HTTP_WRITE_KEY=${RUDDERSTACK_HTTP_WRITE_KEY:-dilibori_http_write_key_local}
      - RUDDERSTACK_JS_WRITE_KEY=${RUDDERSTACK_JS_WRITE_KEY:-dilibori_js_write_key_local}
      - RUDDERSTACK_JS_CONFIG_URL=${RUDDERSTACK_JS_CONFIG_URL:-http://127.0.0.1:8090}
    depends_on:
      - db
      - redis
    networks:
      - default
      - dilibori
    restart: unless-stopped

  db:
    image: mariadb:10.11
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=tastyigniter
      - MYSQL_USER=tastyigniter
      - MYSQL_PASSWORD=tastyigniter
    ports:
      - "3307:3306"
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

networks:
  dilibori:
    name: dilibori
    external: true
