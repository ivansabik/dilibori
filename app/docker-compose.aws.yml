name: dilibori-aws

services:
  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ${HOST_CADDY_PATH}:/data
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
    networks:
      - dilibori
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /dilibori/${PLATFORM_BOX_ENV}/caddy
        awslogs-create-group: "false"

  app:
    image: ${APP_IMAGE}
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${DOMAIN}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: tastyigniter
      DB_USERNAME: tastyigniter
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: file
      QUEUE_CONNECTION: database
      AUTO_PROVISION: "true"
      SEED_MANIFEST: /opt/seed/taconazo/manifest.json
      SEED_MODE: initial
      CDP_ENABLED: "false"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: hola@eltaconazo.example
      MAIL_FROM_NAME: El Taconazo Taqueria
      ADMIN_EMAIL: operations@taconazotaqueria.com
    volumes:
      - ${HOST_MEDIA_PATH}:/var/www/persistent-media:rw
    depends_on:
      - db
    networks:
      - dilibori
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /dilibori/${PLATFORM_BOX_ENV}/app
        awslogs-create-group: "false"

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: tastyigniter
      MYSQL_USER: tastyigniter
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${HOST_DB_PATH}:/var/lib/mysql
    networks:
      - dilibori
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /dilibori/${PLATFORM_BOX_ENV}/db
        awslogs-create-group: "false"

networks:
  dilibori:
    name: dilibori
