[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=/usr/local/bin/apache2-foreground
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
user=www-data
command=/bin/bash -lc 'cd /var/www/html && php artisan queue:work database --sleep=${QUEUE_WORKER_SLEEP:-3} --tries=3 --max-jobs=50 --max-time=3600'
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
user=www-data
command=/bin/bash -lc 'cd /var/www/html && while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done'
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
