[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=/usr/local/bin/apache2-foreground
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
; ponytail: database worker holds 1 of 5 budgeted DB connections and polls every
; --sleep seconds. At ~1000 tenants with sleep=3 that is ~300 light queries/s
; against shared MariaDB. Production uses QUEUE_WORKER_SLEEP=10. When that bites,
; upgrade to per-tenant SQS (same IAM pattern as S3), not ElastiCache.
command=/bin/bash -lc 'cd /var/www/html && php artisan queue:work database --sleep=${QUEUE_WORKER_SLEEP:-3} --tries=3 --max-jobs=50 --max-time=3600'
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/bash -lc 'cd /var/www/html && while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done'
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
